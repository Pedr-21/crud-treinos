<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário de Treino — Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

<div class="plate-stripe" aria-hidden="true"></div>

<main class="auth-wrap">
    <div class="auth-card">
        <div class="brand">
            <span class="brand-mark">DT</span>
            <div>
                <h1 class="brand-title">Diário de Treino</h1>
                <p class="brand-sub">registre a carga. veja a evolução.</p>
            </div>
        </div>

        <div class="tabs" role="tablist">
            <button class="tab active" id="tab-login" role="tab" aria-selected="true">Entrar</button>
            <button class="tab" id="tab-cadastro" role="tab" aria-selected="false">Criar conta</button>
        </div>

        <form id="form-login" class="auth-form">
            <label class="field">
                <span>Email</span>
                <input type="email" name="email" required autocomplete="email" placeholder="voce@email.com">
            </label>
            <label class="field">
                <span>Senha</span>
                <input type="password" name="senha" required autocomplete="current-password" placeholder="••••••••">
            </label>
            <button type="submit" class="btn-primary">Entrar</button>
            <p class="form-msg" id="login-msg" role="status"></p>
        </form>

        <form id="form-cadastro" class="auth-form hidden">
            <label class="field">
                <span>Nome</span>
                <input type="text" name="nome" required autocomplete="name" placeholder="Seu nome">
            </label>
            <label class="field">
                <span>Email</span>
                <input type="email" name="email" required autocomplete="email" placeholder="voce@email.com">
            </label>
            <label class="field">
                <span>Senha</span>
                <input type="password" name="senha" required autocomplete="new-password" placeholder="mínimo 6 caracteres" minlength="6">
            </label>
            <button type="submit" class="btn-primary">Criar conta</button>
            <p class="form-msg" id="cadastro-msg" role="status"></p>
        </form>
    </div>

    <p class="api-hint">API: <code id="api-base-label"></code> — <button class="link-btn" id="btn-change-api">trocar</button></p>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>

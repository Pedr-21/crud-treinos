<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário de Treino — Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

<main class="auth-wrap">
    <div class="auth-card">
        <div class="brand">
            <span class="brand-mark">DT</span>
            <div>
                <h1 class="brand-title">Diário<span class="brand-title-thin">Treino</span></h1>
            </div>
        </div>
        <p class="brand-sub">Entre na sua conta</p>

        <form id="form-login" class="auth-form">
            <label class="field">
                <span>Email</span>
                <input type="email" name="email" required autocomplete="email" placeholder="voce@email.com">
            </label>
            <label class="field">
                <span>Senha</span>
                <div class="password-wrap">
                    <input type="password" name="senha" id="senha-login" required autocomplete="current-password" placeholder="••••••••">
                    <button type="button" class="toggle-password" data-target="senha-login" aria-label="Mostrar senha">
                        <svg class="icon-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </label>
            <button type="submit" class="btn-primary">Entrar</button>
            <p class="form-msg" id="login-msg" role="status"></p>
        </form>

        <a href="cadastro.html" class="btn-outline">Eu não tenho uma conta</a>
    </div>

    <p class="api-hint">API: <code id="api-base-label"></code> — <button class="link-btn" id="btn-change-api">trocar</button></p>
</main>

<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
